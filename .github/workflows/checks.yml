name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate data
        run: python scripts/manage.py validate

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check tracked generated files before build
        run: python scripts/manage.py check --tracked-only

      - name: Build generated artifacts
        run: python scripts/manage.py build

      - name: Check generated artifacts
        run: python scripts/manage.py check

      - name: Detect tracked generated-file drift
        run: git diff --exit-code
